<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Status | Updates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }

        .status-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 550px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            text-transform: uppercase;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 4px 12px;
            border-radius: 100px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-dim);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .image-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        img {
            width: 100%;
            display: block;
            transition: transform 0.3s ease;
        }

        img:hover {
            transform: scale(1.02);
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <div class="status-card">
        <span class="badge">Status Update</span>
        <h1>Current Focus</h1>
        <p>Taking a step back. I'm getting burnt out by trying to post, so I'm hitting pause for a bit.</p>
        
        <div class="image-container">
            <img src="collage_export_D96DAC8A-040B-4FD4-AC21-73BC1FD57500.jpeg" alt="Recent Work Collage">
        </div>

        <footer>
            &copy; 2026 | Built with GitHub Pages
        </footer>
    </div>

</body>
</html>
